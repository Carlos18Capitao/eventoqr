<!DOCTYPE html>

<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventoQR</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="eventoqr.png" type="image/png" />
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">


        <h1>EventoQR</h1>
        <p class="subtitle">Acesso ao painel de gestão</p>

        <form class="card" novalidate>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Email" autocomplete="email">

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password">

            <button id="loginBtn" type="button">Entrar</button>

            <p id="msg" role="status" aria-live="polite"></p>
        </form>


    </div>

    <script type="module" src="login.js"></script>

</body>

</html>

<!DOCTYPE html>

<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Login | EventoQR</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="eventoqr.png" type="image/png" />
</head>

<body>

    <div class="login-container">


        <h1>EventoQR</h1>
        <p class="subtitle">Acesso ao painel de gestão</p>

        <div class="card">
            <input id="email" type="email" placeholder="Email">
            <input id="password" type="password" placeholder="Password">

            <button id="loginBtn">Entrar</button>

            <p id="msg"></p>
        </div>


    </div>

    <script type="module" src="login.js"></script>

</body>

</html>
